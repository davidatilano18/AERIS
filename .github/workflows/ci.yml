name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # Windows: la ingesta y el programador usan APIs de Windows y así se ejecuta en operación.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 = imagen Docker; 3.15 = entorno local de desarrollo.
        python-version: ['3.13', '3.15']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-web.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Pruebas (sin red ni base real)
        run: python -B -m unittest discover -s tests -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen web
        run: docker build --pull -t aeris-web:ci .
      - name: Verificar dependencias e importación sin base de datos
        run: docker run --rm --entrypoint python aeris-web:ci -c "import flask, gunicorn; print('ok')"
